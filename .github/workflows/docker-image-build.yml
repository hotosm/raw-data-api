name: Docker Image CI

on:
  push:
    branches:
      - stage
      - develop

  pull_request:
    branches:
      - stage
      - develop
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Build the Docker image
        run: docker build . --tag raw-data-api:$(date +%s)
